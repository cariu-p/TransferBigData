<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Subir archivo - Demo</title>
</head>
<body>
    <h1>Subir archivo</h1>
    <form action="subir.php" method="POST" enctype="multipart/form-data">
        <p>
            <input type="file" name="archivo" required>
        </p>
        <p>
            El enlace estará disponible durante:
            <input type="number" name="cantidad" value="7" min="1" required style="width: 60px;">
            <select name="unidad">
                <option value="segundos">Segundos</option>
                <option value="minutos">Minutos</option>
                <option value="dias" selected>Días</option>
            </select>
        </p>
        <button type="submit">Subir</button>
    </form>
</body>
</html>
